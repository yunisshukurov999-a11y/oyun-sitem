
<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minecraft - Zepva Games</title>
<style>
* { box-sizing:border-box; }
body {
  margin:0;
  background:#10121b;
  color:white;
  font-family:Arial,sans-serif;
  text-align:center;
}
header {
  padding:22px;
  background:#191c29;
}
header a {
  color:#65e6a2;
  text-decoration:none;
}
main { padding:35px 15px; }
h1 { color:#65e6a2; }
.gamebox {
  max-width:1000px;
  margin:25px auto;
  min-height:420px;
  background:#1c2030;
  border:1px solid #363d52;
  border-radius:15px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:25px;
}
button {
  background:#65e6a2;
  color:#10121b;
  border:0;
  padding:15px 30px;
  border-radius:8px;
  font-size:17px;
  font-weight:bold;
  cursor:pointer;
}
p { color:#b5bacb; }
</style>
</head>
<body>
<header>
  <a href="index.html">← Ana Sayfaya Dön</a>
</header>
<main>
  <h1>⛏️ Minecraft Singleplayer</h1>
  <p>Kendi dünyanı oluştur ve maceraya başla!</p>
  <div class="gamebox">
    <div>
      <h2>🎮 Minecraft</h2>
      <p>Oyun istemcisi henüz bağlanmadı.</p>
      <p>Bir sonraki adımda oyun motorunu ekleyeceğiz.</p>
    </div>
  </div>
</main>

</html>
